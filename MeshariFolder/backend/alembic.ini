# Alembic config. The database URL is NOT set here: alembic/env.py reads it
# from app.config.settings (DATABASE_URL in .env), so the CLI, the app's
# startup migration and the tests all agree on which database they target.
[alembic]
script_location = alembic
# Keep file names sortable and readable: 0002_add_something.py
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
